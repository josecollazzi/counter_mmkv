plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.josecollazzi.counter_mmkv"
    compileSdk = 35
    //ndkVersion = flutter.ndkVersion


    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.8"
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.josecollazzi.counter_mmkv"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "com.google.code.gson:gson:2.10.1"
    implementation 'androidx.compose.foundation:foundation-android:1.7.6'
    implementation "com.ctrip.flight.mmkv:mmkv-kotlin-android:1.2.7"
    modules {
        module("com.tencent:mmkv-static") {
            replacedBy("com.tencent:mmkv", "Using mmkv for flutter")
        }
        module("com.tencent:mmkv-shared") {
            replacedBy("com.tencent:mmkv", "Using mmkv for flutter")
        }
    }
}


flutter {
    source = "../.."
}
